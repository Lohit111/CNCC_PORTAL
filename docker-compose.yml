services:
  cncc-portal:
    build:
      context: ./app
    restart: unless-stopped
    ports:
      - "3000:80"

  api:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/ticket_db
    volumes:
      - ./server/config/firebase-credentials.json:/app/config/firebase-credentials.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ticket_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ticket_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: ticket_db_postgres_data
